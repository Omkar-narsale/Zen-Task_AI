<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Update Assigned Task • Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Global CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            background: #0b0f19;
            color: #fff;
        }

        .card {
            background: #12172a;
            border-radius: 16px;
            border: 1px solid #1f2645;
        }

        .form-control {
            background: #0f1325;
            border: 1px solid #2a3366;
            color: #fff;
        }

        .form-control:focus {
            background: #0f1325;
            color: #fff;
            border-color: #7c7cff;
            box-shadow: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c7cff, #9b5cff);
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-back {
            color: #9aa0c3;
            text-decoration: none;
        }

        .btn-back:hover {
            color: #fff;
        }
    </style>
</head>

<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <div class="card shadow-lg p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0">
                        <i class="bi bi-pencil-square"></i>
                        Update Assigned Task
                    </h4>
                    <a href="/admin/assign-task" class="btn-back">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>
                </div>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Task Title</label>
                        <input type="text"
                               name="title"
                               class="form-control"
                               value="{{ task.title }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Task Description</label>
                        <textarea name="description"
                                  rows="4"
                                  class="form-control"
                                  required>{{ task.description }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Deadline</label>
                        <input type="datetime-local"
                               name="deadline"
                               class="form-control"
                               value="{{ task.deadline.strftime('%Y-%m-%dT%H:%M') }}"
                               required>
                    </div>

                    <button class="btn btn-primary w-100 py-2">
                        <i class="bi bi-save"></i> Update Task
                    </button>

                </form>

            </div>

        </div>
    </div>
</div>

</body>
</html>
